[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bunker-gateway"
version = "1.0.0"
description = "Bunker-Gateway: Reverse Proxy de Inferencia, Firewall Agéntico y Ledger Inmutable de Gobernanza (NIS2 & EU AI Act)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Principal Agent Systems & Harness Architecture Team" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
bunker-gateway = "bunker_gateway.cli.runner:main"
bunker-audit = "bunker_gateway.cli.audit_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
