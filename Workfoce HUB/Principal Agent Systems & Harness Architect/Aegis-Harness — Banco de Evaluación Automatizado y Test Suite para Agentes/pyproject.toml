[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-harness"
version = "1.0.0"
description = "Banco de Evaluación Automatizado y Test Suite para Agentes de IA (Cero Docker)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Agent Systems & Harness Architect" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "reportlab>=4.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
aegis = "aegis.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"
