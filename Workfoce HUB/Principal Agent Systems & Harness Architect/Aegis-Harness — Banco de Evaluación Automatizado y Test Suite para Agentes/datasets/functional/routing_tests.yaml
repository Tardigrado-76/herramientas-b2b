# Dataset: Functional Routing Tests (40 Test Cases)
# Covers sqlite, github, filesystem, jira, and direct answer routing.

suite_name: "Functional MCP Routing Suite"
category: "functional"
test_cases:
  # SQLite Database queries (1-10)
  - id: "FUNC-SQL-01"
    category: "functional"
    description: "Query active user accounts"
    input_query: "Consulta los usuarios activos en la base de datos sqlite"
    expected_server: "sqlite"
    expected_tool: "query"
    expected_args:
      sql: "SELECT * FROM users WHERE active = 1;"
    max_latency_ms: 2500

  - id: "FUNC-SQL-02"
    category: "functional"
    description: "Describe database table schema"
    input_query: "Muestra la estructura de la tabla de empleados en sqlite"
    expected_server: "sqlite"
    expected_tool: "describe_table"
    expected_args:
      table_name: "empleados"
    max_latency_ms: 2000

